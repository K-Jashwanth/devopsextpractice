
apiVersion: apps/v1
kind: Deployment

metadata:
  name: crud-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: crud-app

  template:
    metadata:
      labels:
        app: crud-app

    spec:
      containers:
        - name: crud2
          image: crudimg
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000
