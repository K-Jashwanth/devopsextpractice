name: Node.js CRUD Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript syntax
        run: node --check dockercont/server.js

      - name: Build Docker image
        run: docker build -t crud-backend:latest -f dockercont/Dockerfile .